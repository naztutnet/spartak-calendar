name: Update Spartak calendar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "update_results.py"
      - ".github/workflows/update-results.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: update-spartak-calendar
  cancel-in-progress: false

jobs:
  update:
    name: Check fixtures and results
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update and validate calendar
        run: python update_results.py

      - name: Check generated files
        run: |
          git diff --check
          test -s spartak-moscow.ics
          grep -q "^BEGIN:VCALENDAR" spartak-moscow.ics
          grep -q "^END:VCALENDAR" spartak-moscow.ics

      - name: Commit verified changes
        shell: bash
        run: |
          changes="$(git status --porcelain -- spartak-moscow.ics .github/calendar-state.json)"
          if [ -z "$changes" ]; then
            echo "No verified calendar changes"
            exit 0
          fi

          git config user.name "spartak-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add spartak-moscow.ics .github/calendar-state.json
          git commit -m "Автоматически обновить календарь Спартака"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Close previous failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Сбой автоматического обновления календаря";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            for (const issue of issues.filter(item => item.title === title && !item.pull_request)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Проверка снова проходит успешно. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed"
              });
            }

      - name: Report failure as GitHub issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Сбой автоматического обновления календаря";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "Автоматическая проверка или запись календаря завершилась ошибкой.",
              "",
              `Workflow run: ${runUrl}`,
              `Commit: ${context.sha}`,
              "",
              "После устранения причины следующий успешный запуск автоматически закроет эту задачу."
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(item => item.title === title && !item.pull_request);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
