name: Bootstrap calendar auto-update

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-auto-update.yml"

permissions:
  contents: write
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run updater twice to confirm stable source data
        run: |
          python update_results.py
          python update_results.py
          git diff --check
          test -s spartak-moscow.ics
      - name: Commit bootstrap result and remove workflow
        run: |
          rm -f .github/workflows/bootstrap-auto-update.yml
          git config user.name "spartak-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add spartak-moscow.ics .github/calendar-state.json .github/workflows/bootstrap-auto-update.yml
          git commit -m "Проверить автоматическое обновление календаря"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report bootstrap failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Сбой автоматического обновления календаря";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Контрольный запуск завершился ошибкой. Run: ${runUrl}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(item => item.title === title && !item.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
