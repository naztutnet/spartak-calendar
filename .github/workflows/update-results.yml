name: Update Spartak calendar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "update_results.py"
      - ".github/workflows/update-results.yml"

permissions:
  contents: write

concurrency:
  group: update-spartak-calendar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Check fixtures and results
    runs-on: ${{ github.event_name == 'pull_request' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run updater and capture result
        id: updater
        shell: bash
        run: |
          set +e
          python update_results.py > updater.log 2>&1
          exit_code=$?
          cat updater.log
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate pull request
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          test "${{ steps.updater.outputs.exit_code }}" = "0"
          git diff --check
          test -s spartak-moscow.ics
          grep -q "^BEGIN:VCALENDAR" spartak-moscow.ics
          grep -q "^END:VCALENDAR" spartak-moscow.ics

      - name: Validate and commit successful update
        if: github.event_name != 'pull_request' && steps.updater.outputs.exit_code == '0'
        shell: bash
        run: |
          rm -f .github/last-error.log
          git diff --check
          test -s spartak-moscow.ics
          grep -q "^BEGIN:VCALENDAR" spartak-moscow.ics
          grep -q "^END:VCALENDAR" spartak-moscow.ics

          changes="$(git status --porcelain -- spartak-moscow.ics .github/calendar-state.json .github/last-error.log)"
          if [ -z "$changes" ]; then
            echo "No verified calendar changes"
            exit 0
          fi

          git config user.name "spartak-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A spartak-moscow.ics .github/calendar-state.json .github/last-error.log
          git commit -m "Автоматически обновить календарь Спартака [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Store visible failure report
        if: github.event_name != 'pull_request' && steps.updater.outputs.exit_code != '0'
        shell: bash
        run: |
          {
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo
            cat updater.log
          } > .github/last-error.log

          git config user.name "spartak-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/last-error.log
          if ! git diff --cached --quiet; then
            git commit -m "Зафиксировать ошибку обновления календаря [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          exit 1

# Verification PR: execute updater without publishing calendar changes.
